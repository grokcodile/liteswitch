<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    A twisted cord hanging from off-frame into a pull ring.

    The mark this replaced was the ⌘ glyph, inherited from the app's old name.
    Two problems with it under this one: it named the category (keyboard app)
    rather than the argument the name makes, and Key54 already uses ⌘ — two apps
    from the same shelf sharing a mark is confusion, not continuity.

    Everything is sized to survive the 16px slice, because that is what Finder's
    list view renders and this app has no Dock icon to be seen in. Two masses,
    one vertical and one round: at 16px it is a bar and an O, which is still
    legibly a cord and a ring. The twist is the first thing to go at small sizes
    and is meant to — it is surface, not structure.
  -->
  <defs>
    <!-- macOS app icons are an 824x824 squircle inside a 1024 canvas, r=185. -->
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <clipPath id="cordShape">
      <rect x="485" y="80" width="54" height="500" rx="27"/>
    </clipPath>

    <!-- Charcoal-navy ground, carried over from the old icon: the palette is
         the only thing worth keeping, and a dark ground is what makes a single
         warm hue read as lit rather than printed. -->
    <radialGradient id="ground" gradientUnits="userSpaceOnUse" cx="512" cy="430" r="620">
      <stop offset="0"    stop-color="#273146"/>
      <stop offset="0.52" stop-color="#1A2132"/>
      <stop offset="1"    stop-color="#0C101D"/>
    </radialGradient>

    <!-- Across the cord, not along it: this is what makes it a cylinder. -->
    <linearGradient id="cordBase" gradientUnits="userSpaceOnUse" x1="485" y1="0" x2="539" y2="0">
      <stop offset="0"    stop-color="#77839F"/>
      <stop offset="0.35" stop-color="#FDFEFF"/>
      <stop offset="0.72" stop-color="#C9D2E4"/>
      <stop offset="1"    stop-color="#77839F"/>
    </linearGradient>
    <linearGradient id="cordRound" gradientUnits="userSpaceOnUse" x1="485" y1="0" x2="539" y2="0">
      <stop offset="0"    stop-color="#000000" stop-opacity="0.42"/>
      <stop offset="0.16" stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="0.34" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.52" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="0.78" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.50"/>
    </linearGradient>

    <!-- The twist. What reads as rope at this size is the shadow *between*
         plies, not the plies themselves — drawing bright strands produced
         nothing visible at all. One tile is exactly the cord's width by the
         twist pitch, so a single column of tiles covers it; each line is drawn
         three times, one pitch up and down, so the diagonals meet across the
         tile seams. Kept faint on purpose: this should read as cord texture,
         not as a rope diagram. -->
    <pattern id="twist" patternUnits="userSpaceOnUse" x="485" y="0" width="54" height="34">
      <g fill="none" stroke="#0B1020" stroke-opacity="0.24" stroke-width="9">
        <path d="M0,-4 L54,-30"/><path d="M0,30 L54,4"/><path d="M0,64 L54,38"/>
      </g>
      <g fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="6">
        <path d="M0,6 L54,-20"/><path d="M0,40 L54,14"/><path d="M0,74 L54,48"/>
      </g>
    </pattern>

    <!-- Safety orange, the colour every real pull-cord machine is painted. One
         hue rather than the old four: a mark that is an object wants a local
         colour, and a single hue survives a monochrome or tinted rendering if
         this ever becomes a layered .icon bundle. -->
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="416" y1="574" x2="608" y2="802">
      <stop offset="0"    stop-color="#FFBC5A"/>
      <stop offset="0.45" stop-color="#FF9018"/>
      <stop offset="1"    stop-color="#D45F00"/>
    </linearGradient>

    <!-- Greyer than the cord so it reads as a separate metal collar. -->
    <linearGradient id="ferrule" gradientUnits="userSpaceOnUse" x1="464" y1="512" x2="560" y2="560">
      <stop offset="0"   stop-color="#C2CCDE"/>
      <stop offset="0.5" stop-color="#8F9BB4"/>
      <stop offset="1"   stop-color="#65718C"/>
    </linearGradient>

    <linearGradient id="topLight" gradientUnits="userSpaceOnUse" x1="512" y1="100" x2="512" y2="390">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#ground)"/>

    <!-- Cast shadow. Without it the mark floats rather than hangs. -->
    <g transform="translate(14,20)" opacity="0.45" filter="url(#soft)">
      <rect x="485" y="60" width="54" height="480" rx="27" fill="#000000"/>
      <circle cx="512" cy="686" r="120" fill="none" stroke="#000000" stroke-width="70"/>
    </g>

    <!-- The cord runs off the top edge rather than starting inside the tile:
         it comes from somewhere above, which is the point of the name. -->
    <g clip-path="url(#cordShape)">
      <rect x="485" y="80" width="54" height="500" fill="url(#cordBase)"/>
      <rect x="485" y="80" width="54" height="500" fill="url(#twist)"/>
      <rect x="485" y="80" width="54" height="500" fill="url(#cordRound)"/>
    </g>

    <circle cx="512" cy="686" r="120" fill="none" stroke="url(#ring)" stroke-width="70"/>
    <path d="M424 632 A 112 112 0 0 1 474 580" fill="none" stroke="#FFFFFF"
          stroke-opacity="0.30" stroke-width="13" stroke-linecap="round"/>

    <!-- The ferrule is not decoration. Without a collar at the joint the
         silhouette reads as a magnifying glass; with it, the eye reads a cord
         terminating in hardware. Drawn last so it caps both cord and ring. -->
    <rect x="464" y="512" width="96" height="48" rx="21" fill="url(#ferrule)"/>

    <rect x="103.25" y="103.25" width="817.5" height="817.5" rx="181.75"
          fill="none" stroke="url(#topLight)" stroke-width="2.5"/>
  </g>
</svg>
